<aside class="sidebar">
  <div class="sidebar-brand">
    <img src="logo.png" alt="intersecmail logo" class="brand-img">
  </div>

  <nav class="sidebar-nav">
    <!-- Dynamic Computed Links Block based on user role status -->
    <div class="nav-section">
      @for (item of coreNav(); track item.route) {
        <a [routerLink]="item.route" 
           routerLinkActive="active" 
           class="nav-item"
           [class.specialty]="auth.isSuperAdmin()">
          <i [class]="item.icon"></i>
          <span class="nav-label">{{ item.label }}</span>
          @if (item.badge) {
            <span class="nav-badge">{{ item.badge }}</span>
          }
        </a>
      }
    </div>
  </nav>

  <!-- Authenticated User Context Footer Chassis -->
  <!-- Safely matching your auth.user() computed signal mapping -->
  @if (auth.user(); as activeUser) {
    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="avatar">
          {{ activeUser.full_name ? activeUser.full_name.charAt(0).toUpperCase() : 'U' }}
        </div>
        <div class="user-meta">
          <div class="user-name">{{ activeUser.full_name || 'User Profile' }}</div>
          <div class="user-role">{{ auth.role() | titlecase }}</div>
        </div>
      </div>
      <button class="btn-logout" (click)="auth.logout()" title="Sign Out">
        <i class="ti-logout"></i>
      </button>
    </div>
  }
</aside>
